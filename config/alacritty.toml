[font]
size              = 9.0

[font.normal]
family            = "JetBrainsMono Nerd Font"
style             = "Regular"

[font.bold]
family            = "JetBrainsMono Nerd Font"
style             = "Bold"

[font.italic]
family            = "JetBrainsMono Nerd Font"
style             = "Italic"

[font.bold_italic]
family            = "JetBrainsMono Nerd Font"
style             = "Bold Italic"

[colors.primary]
background        = "#101010"
foreground        = "#cccccc"
bright_foreground = "#ffffff"

[colors.normal]
black             = "#101010"
red               = "#ed4a46"
green             = "#70b433"
yellow            = "#dbb32d"
blue              = "#368aeb"
magenta           = "#eb6eb7"
cyan              = "#3fc5b7"
white             = "#cccccc"

[colors.bright]
black             = "#777777"
red               = "#ff5e56"
green             = "#83c746"
yellow            = "#efc541"
blue              = "#4f9cfe"
magenta           = "#ff81ca"
cyan              = "#56d8c9"
white             = "#ffffff"
